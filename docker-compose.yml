services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/noisling
      - MUSIC_DIR=/music
      - PORT=3000
    volumes:
      - /mnt/data/music:/music:ro
      - covers:/app/server/covers
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  covers:
